name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Uses package-lock.json when it exists; otherwise installs and keeps the lockfile it made as an artifact.
      - name: Install
        run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Known vulnerabilities (report only)
        run: npm audit --omit=dev --audit-level=high || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-lock
          path: package-lock.json

  # Run by hand (Actions → Checks → Run workflow) to create or refresh package-lock.json on a branch.
  lockfile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || (git commit -m "Update package-lock.json" && git push)
